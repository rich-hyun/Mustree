------------------------------ */
const networks = [
  { name:"Mustree", rpc:"https://block.mst3.site", chain:7601, symbol:"MST" },
  { name:"JKK-TMZ", rpc:"https://jkk.mst2.site", chain:7707, symbol:"TMZ" },
  { name:"KukminBank", rpc:"https://rpc.mstblock.com", chain:1213, symbol:"KBB" },
  { name:"NABIZAM", rpc:"https://nbmst.mst2.site", chain:7602, symbol:"NBZ" },
  { name:"MDPCD", rpc:"https://mdpcd.mst2.site", chain:7603, symbol:"MDP" }
];

// Mustree 먼저 정렬
const sorted = [
  networks.find(n=>n.name==="Mustree"),
  ...networks.filter(n=>n.name!=="Mustree").sort((a,b)=>a.name.localeCompare(b.name))
];

// 셀렉트 박스 구성
const netSelect = document.getElementById("netSelect");
sorted.forEach(n=>{
  const opt=document.createElement("option");
  opt.value=n.name;
  opt.textContent=n.name;
  netSelect.appendChild(opt);
});

function getSelectedNet(){
  return sorted.find(n=>n.name===netSelect.value);
}

function updateNetworkInfo(){
  const n=getSelectedNet();
  document.getElementById("netName").textContent=n.name;
  document.getElementById("netRpc").textContent=n.rpc;
  document.getElementById("netChain").textContent=n.chain;
  document.getElementById("netSymbol").textContent=n.symbol;
}
updateNetworkInfo();

async function switchNetwork(net){
  const chainHex="0x"+net.chain.toString(16);
  try {
    await ethereum.request({
      method:"wallet_switchEthereumChain",
      params:[{chainId:chainHex}]
    });
  } catch(e) {
    if (e.code===4902) {
      await ethereum.request({
        method:"wallet_addEthereumChain",
        params:[{
          chainId:chainHex,
          chainName:net.name,
          rpcUrls:[net.rpc],
          nativeCurrency:{name:net.symbol, symbol:net.symbol, decimals:18}
        }]
      });
      await ethereum.request({
        method:"wallet_switchEthereumChain",
        params:[{chainId:chainHex}]
      });
    }
  }
}

netSelect.addEventListener("change", async()=>{
  updateNetworkInfo();
  await switchNetwork(getSelectedNet());
});

   4) 코드 생성
------------------------------ */
const logOut=document.getElementById("logOut");

document.getElementById("codeGen").addEventListener("click", ()=>{
  const owner=document.getElementById("owner").value.trim();
  const nftName=document.getElementById("nftName").value.trim();
  const metadata=document.getElementById("metadata").value.trim() || "{}";

  if(!owner || !nftName){
    logOut.textContent="모든 필드를 입력하세요.";
    return;
  }

  const net=getSelectedNet();

  const code=`
pragma solidity ^0.8.20;

interface INFTVault {
    function mintNFT(
        address to,
        string memory label,
        string memory metadata
    ) external returns (uint256);
}

contract NFT_Mint_${net.name} {
    address constant VAULT = 0xYourNFTVault;
    INFTVault constant vault = INFTVault(VAULT);

    function createNFT() external {
        vault.mintNFT(
            ${JSON.stringify(owner)},
            ${JSON.stringify(nftName)},
            ${JSON.stringify(metadata)}
        );
    }
}
  `.trim();

  logOut.textContent = code;
});

/* ------------------------------
   5) NFT 발행 실행
------------------------------ */
document.getElementById("txExec").addEventListener("click", execNFT);

async function execNFT(){
  const owner=document.getElementById("owner").value.trim();
  const nftName=document.getElementById("nftName").value.trim();
  const metadata=document.getElementById("metadata").value.trim() || "{}";

  if(!owner || !nftName){
    logOut.textContent="❌ 모든 필드를 입력하세요.";
    return;
  }

  try {
    await ethereum.request({method:"eth_requestAccounts"});

    const net=getSelectedNet();
    const CONTRACT_ADDRESS=CONTRACTS[net.name];

    const provider=new ethers.BrowserProvider(ethereum);
    const signer=await provider.getSigner();

    const contract=new ethers.Contract(CONTRACT_ADDRESS, NFT_ABI, signer);

    logOut.textContent="트랜잭션 생성 중...";

    // tokenId 예측
    const predicted = await contract.mintNFT.staticCall(owner, nftName, metadata);

    const tx = await contract.mintNFT(owner, nftName, metadata);

    logOut.textContent=
      `TX 전송됨\n` +
      `예상 TokenID: ${predicted}\n` +
      `TX Hash: ${tx.hash}`;

    const receipt = await tx.wait();

    logOut.textContent =
      `🎉 NFT 발행 성공!\n` +
      `Token ID: ${predicted}\n` +
      `TX: ${receipt.hash}\n` +
      `Block: ${receipt.blockNumber}`;

  } catch(err){
    logOut.textContent="오류: "+err.message;
  }
}

    safeMetadata = JSON.stringify(JSON.parse(metadataRaw));

    alert("❌ Metadata가 JSON 형식이 아닙니다.");
    return;
  }

# ----------------------------------------------------------

# pip install web3

from web3 import Web3

CHAIN_ID = ${net.chain}
CONTRACT = "${CONTRACT}"

PRIVATE_KEY = "0xYourPrivateKeyHere"

ABI = json.loads(\"\"\"${ABI}\"\"\")

w3 = Web3(Web3.HTTPProvider(RPC))
acct = w3.eth.account.from_key(PRIVATE_KEY)
contract = w3.eth.contract(address=CONTRACT, abi=ABI)

tx = contract.functions.mintNFT(
    Web3.to_checksum_address("${checksumOwner}"),
    "${nftName}",
    '${safeMetadata}'
).build_transaction({
    "from": acct.address,
    "nonce": w3.eth.get_transaction_count(acct.address),
    "gas": 600000,
    "gasPrice": w3.eth.gas_price,
    "chainId": CHAIN_ID,
})


# 2) 서명 & 전송
signed = acct.sign_transaction(tx)
tx_hash = w3.eth.send_raw_transaction(signed.raw_transaction)

print("🚀 NFT Mint TX Hash:", tx_hash.hex())
print("⏳ Waiting for confirmation...")

# 3) 블록 포함될 때까지 대기
receipt = w3.eth.wait_for_transaction_receipt(tx_hash)

if receipt.status != 1:
    raise Exception("❌ NFT Mint Failed (Transaction Reverted)")
else:
    print("✅ NFT Mint Success!")

# 4) Token ID 추출 (Event or nextTokenId fallback)
try:
    event_log = receipt["logs"][0]
    token_id = int(event_log["data"], 16)
except:
    token_id = contract.functions.nextTokenId().call() - 1

# 5) Owner 조회
owner_addr = contract.functions.ownerOf(token_id).call()

print("\\n🎯 MINT RESULT")
print("---------------------------")
print("📌 Token ID:", token_id)
print("👤 Owner:", owner_addr)
print("📜 Contract:", CONTRACT)
print("---------------------------")
