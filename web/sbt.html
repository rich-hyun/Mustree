  { name:"KukminBank", rpc:"https://rpc.mstblock.com", chain:1213, symbol:"KBB" },
  { name:"NABIZAM", rpc:"https://nbmst.mst2.site", chain:7602, symbol:"NBZ" },
  { name:"MDPCD", rpc:"https://mdpcd.mst2.site", chain:7603, symbol:"MDP" }
];

// Mustree 고정 + 나머지 알파벳 정렬
const sorted = [
  networks.find(n => n.name === "Mustree"),
  ...networks.filter(n => n.name !== "Mustree").sort((a,b)=>a.name.localeCompare(b.name))
];

/* ---------------------------
   2) 셀렉트 박스 채우기
--------------------------- */
const netSelect = document.getElementById("netSelect");
sorted.forEach(n => {
  const opt = document.createElement("option");
  opt.value = n.name;
  opt.textContent = n.name;
  netSelect.appendChild(opt);
});

   3) 네트워크 선택 시 정보 표시
--------------------------- */
function getSelectedNet() {
  return sorted.find(n => n.name === netSelect.value);
}

function updateNetworkInfo() {
  const selected = getSelectedNet();
  document.getElementById("netName").textContent = selected.name;
  document.getElementById("netRpc").textContent = selected.rpc;
  document.getElementById("netChain").textContent = selected.chain;
  document.getElementById("netSymbol").textContent = selected.symbol;
}

/* MetaMask 네트워크 전환 함수 */
async function switchToNetwork(net) {
  const chainHex = "0x" + net.chain.toString(16);

  try {
    // 우선 전환 시도
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: chainHex }]
    });

    // 실제 전환 검증
    const current = await window.ethereum.request({ method: "eth_chainId" });
    if (current.toLowerCase() !== chainHex.toLowerCase()) {
      throw new Error("Switch failed, re-adding network...");
    }

    console.log("Network switched:", current);

  } catch (err) {
    console.log("Switch error:", err);

    // 네트워크가 없으면 추가
    if (err.code === 4902 || err.message.includes("re-adding")) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: chainHex,
          chainName: net.name,
          rpcUrls: [net.rpc],
          nativeCurrency: {
            name: net.symbol,
            symbol: net.symbol,
            decimals: 18
          }
        }]
      });

      // 추가 후 다시 전환
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: chainHex }]
      });

    } else {
      alert("네트워크 전환 실패: " + err.message);
    }
  }
}


// 네트워크 선택 시, 정보 갱신 + MetaMask 전환
netSelect.addEventListener("change", async () => {
  updateNetworkInfo();
  const selected = getSelectedNet();
  await switchToNetwork(selected);
});

// 초기 표시

    solOut.textContent = "모든 항목을 입력해야 코드가 생성됩니다.";
    return;
  }

  const net = getSelectedNet();

  const code = `
pragma solidity ^0.8.20;

interface ISBTVault {
    function mintSBT(
        address to,
        string memory label,
        address guardian,
        uint256 unlockTime,
        string memory metadata
    ) external;
}

contract SBT_Mint_${net.name} {

    address constant VAULT = 0xYourVaultContractAddress; 
    ISBTVault constant vault = ISBTVault(VAULT);

    function createSBT() external {
        vault.mintSBT(
            ${JSON.stringify(owner)},
            ${JSON.stringify(sbtName)},
            ${JSON.stringify(guardian)},
            0,
            "{}"
        );
    }

  `.trim();

  solOut.textContent = code;
});

async function execMintTx() {
  if (!window.ethereum) {
    solOut.textContent = "MetaMask가 감지되지 않습니다.";
    return;
  }

  const owner = document.getElementById("owner").value.trim();
  const sbtName = document.getElementById("sbtName").value.trim();
  const guardian = document.getElementById("guardian").value.trim();

  if (!owner || !sbtName || !guardian) {
    solOut.textContent = "모든 항목을 입력해야 합니다.";
    return;
  }

  try {
    await ethereum.request({ method: "eth_requestAccounts" });

    const selected = getSelectedNet();
    if (!selected) {
      solOut.textContent = "❌ 네트워크를 선택해주세요.";
      return;
    }
    const CONTRACT_ADDRESS = CONTRACTS[selected.name];

    if (!CONTRACT_ADDRESS || CONTRACT_ADDRESS.length !== 42) {
      solOut.textContent = `❌ ${selected.name} 네트워크 컨트랙트 주소가 잘못되었습니다.`;
      return;
    }

    const provider = new ethers.BrowserProvider(window.ethereum);
    const signer = await provider.getSigner();
    const contract = new ethers.Contract(CONTRACT_ADDRESS, VAULT_ABI, signer);

    solOut.textContent = "트랜잭션 전송 중...";

    // Mustree 보안 정책 때문에 이벤트 로그는 못 읽음 → callStatic로 tokenId 사전 계산
    const tokenId = await contract.mintSBT.staticCall(
      owner,
      sbtName,
      guardian,
      0,
      "{}"
    );

    const txResponse = await contract.mintSBT(
      owner, sbtName, guardian, 0, "{}"
    );

    solOut.textContent =
      `TX 생성됨!\n` +
      `TX Hash: ${txResponse.hash}\n` +
      `Token ID (예상): ${tokenId}\n컨펌 대기 중...`;

    const receipt = await txResponse.wait();

    solOut.textContent =
      `🎉 SBT 발행 성공!\n` +
      `Token ID: ${tokenId}\n` +
      `TX Hash: ${receipt.hash}\n` +
      `Block: ${receipt.blockNumber}`;

  } catch (err) {
    solOut.textContent = "실행 오류: " + (err?.message || err);
  }
}

// 실행 버튼에 핸들러 연결
document.getElementById("txExec").addEventListener("click", execMintTx);
