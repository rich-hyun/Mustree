<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MST 네트워크 대시보드</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    .dash-container { max-width:900px;margin:40px auto;padding:20px; }
    table { width:100%; border-collapse: collapse; margin-top:20px;}
    th, td { padding:10px; border-bottom:1px solid #ddd; text-align:left; }
    th { background:#151823; 
    color:#dce0f5; }
    .refresh-btn {
      padding:10px 16px;
      background:#0284c7;
      color:white;
      border-radius:6px;
      display:inline-block;
      cursor:pointer;
      margin-top:10px;
    }
    .update-time-neo {
      margin-top: 40px;
      text-align: center;

      /* ★ 글자 크기 3배 증가 */
      font-size: 45px;
      font-weight: 800;

      color: #5cd4ff;

      text-shadow:
        0 0 12px rgba(0, 200, 255, 1),
        0 0 22px rgba(0, 200, 255, 0.9),
        0 0 38px rgba(0, 200, 255, 0.7),
        0 0 60px rgba(0, 200, 255, 0.45);

      opacity: 0;

      animation: fadeIn 1.4s ease-out forwards,
                glowPulse 2.4s infinite alternate;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes glowPulse {
      0% { text-shadow: 0 0 14px rgba(0, 200, 255, 0.7); }
      100% { text-shadow: 0 0 38px rgba(0, 200, 255, 1); }
    }

  </style>
</head>

<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="hdr-left">
        <h1>머스트리 네트워크</h1>
        <nav class="menu">
          <a href="./index.html">홈</a>
          <a href="./network.html">네트워크 생성 서비스</a>
          <a href="./api.html">API 리스트</a>
          <a href="./api-guide.html">API 가이드</a>
          <a href="./security.html">보안 정책</a>
          <a href="./dashboard.html" class="active">대시보드</a>
          <a href="./staking.html">스테이킹</a>
          <a href="./bridge.html">브릿지 (준비중)</a>
          <a href="./sbt.html">SBT 생성</a>
          <a href="./rwa.html">RWA 생성</a>
          <a href="./nft.html">NFT 생성</a>
        </nav>
      </div>
    </div>
  </header>

<section class="hero hero-visual">
  <div class="hero-bg"></div>
  <div class="container hero-inner">
    <p class="eyebrow">Network Dashboard</p>
    <h1>MST 네트워크 토큰 잔액 대시보드</h1>
    <p class="sub">MST 네트워크의 주요 지갑 잔액을 실시간 모니터링합니다.</p>
    <div id="updateTimeBig" class="update-time-neo"></div>
  </div>
</section>

  <main class="dash-container">
    <h2>MST 네이티브 토큰 잔액 대시보드</h2>
    <p>아래 표는 MST 네트워크의 주요 지갑 잔액을 실시간으로 표시합니다.</p>

    <div id="updateTime" style="margin-top:10px;color:#555; display:none;"></div>

    <table>
      <thead>
        <tr>
          <th>구분</th>
          <th>주소</th>
          <th>잔액 (MST)</th>
        </tr>
      </thead>
      <tbody id="walletTable"></tbody>
    </table>

    <div class="refresh-btn" onclick="loadBalances()">새로고침</div>
  </main>

  <script>
    async function loadBalances() {
      const res = await fetch("https://api.mst3.site/api/balances")
      const json = await res.json();

      const tbody = document.getElementById("walletTable");
      tbody.innerHTML = "";

      json.data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.label}</td>
          <td>${row.address}</td>
          <td>${row.balance.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });

      const formattedTime = new Date(json.updated).toLocaleString();
      const text = `⟳ 업데이트 시각: ${formattedTime}`;

      // [UPGRADE] 네온 스타일 영역 업데이트
      const updateElem = document.getElementById("updateTimeBig");
      updateElem.innerText = text;
      updateElem.style.animation = "none";      // 재실행 위해 초기화
      void updateElem.offsetWidth;              // 강제 리플로우
      updateElem.style.animation = "";          // 애니메이션 재적용
    }

    loadBalances();
  </script>
</body>
</html>
